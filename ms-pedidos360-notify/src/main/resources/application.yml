server:
  port: 8083
spring:
  application:
    name: ms-pedidos360-notify
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:p360}
    password: ${SPRING_RABBITMQ_PASSWORD:p360pass}
    listener:
      simple:
        acknowledge-mode: manual         # cada consumidor hace ACK/NACK explicito (ver MessageAcknowledger)
        default-requeue-rejected: false  # un rechazo va a la DLQ, no vuelve a la cola
        prefetch: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          # Nota: el JwtDecoder personalizado (JwtDecoderConfig) hace la validacion real
          # y acepta issuer v1.0 y v2.0. Estas propiedades quedan como documentacion.
          jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:726876d2-e741-443b-91af-5309677e4def}/discovery/v2.0/keys

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    cl.duoc.p360: DEBUG

p360:
  messaging:
    # Unica fuente de verdad de los nombres de RabbitMQ (mismos valores en orders y mqadmin)
    max-retries: 3   # reintentos ante errores recuperables antes de enviar a la DLQ
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead-letter: cmd.dead.dlx
    email:
      queue: q.cmd.email
      dead-letter-queue: q.cmd.email.dlq
      routing-key: email.send
      topic-pattern: "email.*"
    kitchen:
      queue: q.cmd.kitchen
      dead-letter-queue: q.cmd.kitchen.dlq
      routing-key: kitchen.ticket
      topic-pattern: "kitchen.#"
    invoice:
      queue: q.cmd.invoice
      dead-letter-queue: q.cmd.invoice.dlq
      routing-key: invoice.gen
      topic-pattern: "invoice.*"
  azure:
    tenant-id: ${AZURE_TENANT_ID:726876d2-e741-443b-91af-5309677e4def}
    api-client-id: ${API_CLIENT_ID:c7f6f983-e84b-4d1b-8f5a-da6dcac01435}
